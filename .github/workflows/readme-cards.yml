name: Update README cards

# The shared github-readme-stats.vercel.app instance keeps getting paused
# (HTTP 503 DEPLOYMENT_PAUSED), which breaks every README pointing at it.
# Render the cards here instead and commit them as static SVGs, so the
# README depends on no third-party card server at view time.

on:
  schedule:
    # Every 6 hours so the streak card's current streak stays close to live.
    - cron: "37 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/readme-cards.yml

concurrency:
  group: readme-cards-${{ github.ref }}

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      STATS: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&bg_color=00000000
      # Weighted equally by repo count and bytes so one data-heavy notebook repo
      # does not drown out everything else.
      LANGS: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide_border=true&bg_color=00000000
      DARK: theme=tokyonight&title_color=58a6ff&text_color=c9d1d9
      LIGHT: title_color=0969da&text_color=1f2328
      STREAK: user=${{ github.repository_owner }}&hide_border=true&background=00000000

    steps:
      - uses: actions/checkout@v6

      # fail_on_error stops a rate-limited run from committing a
      # "Something went wrong" card over the last good one.
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS }}&${{ env.DARK }}&icon_color=58a6ff
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS }}&${{ env.LIGHT }}&icon_color=0969da
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS }}&${{ env.DARK }}
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS }}&${{ env.LIGHT }}
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # This action already exits non-zero on any fetch error.
      - name: Streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: ${{ env.STREAK }}&theme=tokyonight&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: ${{ env.STREAK }}&ring=0969da&fire=0969da&currStreakLabel=0969da
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: refresh README stats cards"
          git push origin "HEAD:${GITHUB_REF_NAME}"
